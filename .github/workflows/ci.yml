name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax and shellcheck
        run: |
          bash -n scripts/benchmark_ollama.sh
          shellcheck scripts/benchmark_ollama.sh

      - name: Ruff
        run: |
          pip install ruff==0.17.3
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Tests against mock Ollama
        run: python -m unittest discover -s tests -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
